    // ==========================================
    // HÀM PARSE JSON AN TOÀN (TỰ ĐỘNG FIX LỖI LATEX BACKSLASH)
    // ==========================================
    function safeParseJSON(rawText) {
      if (!rawText || typeof rawText !== "string") {
        throw new Error("Dữ liệu phản hồi từ AI rỗng.");
      }

      let clean = rawText
        .replace(/^```json\s*/i, "")
        .replace(/^```\s*/i, "")
        .replace(/```\s*$/i, "")
        .trim();

      try {
        return JSON.parse(clean);
      } catch (err1) {
        try {
          // Thoát tất cả dấu gạch chéo ngược LaTeX (\frac, \sqrt, \neq, \alpha, ...)
          const fixed = clean.replace(/\\(?!["\\])/g, "\\\\");
          return JSON.parse(fixed);
        } catch (err2) {
          const match = clean.match(/\{[\s\S]*\}/);
          if (match) {
            const fixedMatch = match[0].replace(/\\(?!["\\])/g, "\\\\");
            return JSON.parse(fixedMatch);
          }
          throw new Error(`Lỗi cú pháp JSON: ${err1.message}`);
        }
      }
    }

    // ==========================================
    
    // ==========================================
    // HÀM NÉN ẢNH CLIENT-SIDE BẰNG CANVAS
    // Giảm dung lượng ảnh chụp 10MB xuống ~250KB JPEG, max 1600px
    // Giúp Vision API nhận diện tức thì, không bị lỗi 413, không tràn LocalStorage
    // ==========================================
    function compressImage(file, maxWidth = 1600, quality = 0.85) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth || height > maxWidth) {
              if (width > height) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              } else {
                width = Math.round((width * maxWidth) / height);
                height = maxWidth;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL("image/jpeg", quality);
            resolve(dataUrl);
          };
          img.onerror = () => resolve(event.target.result);
          img.src = event.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // COMPONENT HIỂN THỊ CÔNG THỨC TOÁN KATEX
    // ==========================================
    function MathView({ text, className = "", block = false }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current) return;
        try {
          if (window.renderMathInElement) {
            window.renderMathInElement(containerRef.current, {
              delimiters: [
                { left: "$$", right: "$$", display: true },
                { left: "$", right: "$", display: false },
                { left: "\\[", right: "\\]", display: true },
                { left: "\\(", right: "\\)", display: false }
              ],
              throwOnError: false
            });
          }
        } catch (e) {
          console.warn("KaTeX render error:", e);
        }
      }, [text]);

      const formatted = useMemo(() => {
        if (!text) return "";
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }, [text]);

      const Tag = block ? "div" : "span";
      return <Tag ref={containerRef} className={className} dangerouslySetInnerHTML={{ __html: formatted }} />;
    }

    const calculateTrueFalseScore = (userAnswers, statements) => {
      let correctCount = 0;
      statements.forEach(stmt => {
        if (userAnswers && userAnswers[stmt.key] === stmt.correct) {
          correctCount++;
        }
      });
      if (correctCount === 1) return 0.1;
      if (correctCount === 2) return 0.25;
      if (correctCount === 3) return 0.5;
      if (correctCount === 4) return 1.0;
      return 0;
    };

    const normalizeShortAnswer = (val) => {
      if (!val) return "";
      return val.toString().trim().replace(",", ".").replace(/\s+/g, "");
    };

          return [];

          setSelectedChapter(chapList[0].id);
          setSelectedLesson(chapList[0].lessons[0]);
        }
      };

        setSelectedChapter(chapId);

        if (chap && chap.lessons.length > 0) {
          setSelectedLesson(chap.lessons[0]);
        }
      };

        const val = key.trim();
        setApiKey(val);
        localStorage.setItem("GEMINI_API_KEY", val);
        setKeyStatus(null);
        setKeyMessage("");
      };

      const handleTestApiKey = async () => {
        const cleanKey = apiKey.trim();
        if (!cleanKey) {
          alert("Vui lòng dán mã Gemini API Key vào ô trước khi kiểm tra!");
          return;
        }

        setKeyStatus("testing");
        setKeyMessage("Đang kiểm tra kết nối với Google AI Studio...");

        for (const model of CANDIDATE_MODELS) {
          try {
            const res = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cleanKey}`,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: "Hello" }] }]
                })
              }
            );

            const data = await res.json();
            if (res.ok && data?.candidates?.[0]?.content?.parts?.[0]?.text) {
              setKeyStatus("valid");
              setKeyMessage(`✅ API Key hợp lệ! Đã kết nối thành công mô hình: ${model}`);
              return;
            }
            if (data?.error?.message) {
              if (res.status === 404) continue; // Thử model kế tiếp
              setKeyStatus("invalid");
              setKeyMessage(`❌ Lỗi API (${res.status}): ${data.error.message}`);
              return;
            }
          } catch (e) {
            // Tiếp tục thử model sau
          }
        }

        setKeyMessage("❌ Không thể kết nối tới Gemini API. Hãy kiểm tra lại API Key hoặc đường truyền mạng.");

Bạn là chuyên gia khảo thí môn Toán THCS bộ sách "Kết nối tri thức với cuộc sống".

          `"Toan ${sub.grade}"`,
          `"${sub.lesson.replace(/"/g, '""')}"`,
          `"Bài KT ${sub.testNum}"`,
          sub.scorePart1,
          sub.scorePart2,
          sub.scorePart3,
          sub.scorePart4,
          sub.totalScore,
          sub.totalScore >= 8 ? "Gioi" : sub.totalScore >= 6.5 ? "Kha" : sub.totalScore >= 5 ? "Dat" : "Chua dat",
          `"${sub.timestamp}"`,
          `"${(sub.feedbacks?.part1 || "").replace(/"/g, '""')}"`,
          `"${(sub.feedbacks?.part2 || "").replace(/"/g, '""')}"`,
          `"${(sub.feedbacks?.part3 || "").replace(/"/g, '""')}"`,
          `"${(sub.feedbacks?.part4 || "").replace(/"/g, '""')}"`,
          `"${(sub.feedbacks?.overall || sub.overallTeacherComment || "").replace(/"/g, '""')}"`
        ]);

        const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", `Bang_Diem_${filterClass}_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const uniqueClasses = useMemo(() => {
        const set = new Set(submissions.map(s => s.className));
        return Array.from(set).sort();
      }, [submissions]);

      const classStats = useMemo(() => {
        const filtered = getFilteredSubmissions();
        if (filtered.length === 0) return null;
        const total = filtered.reduce((acc, cur) => acc + cur.totalScore, 0);
        const avg = (total / filtered.length).toFixed(2);
        const gioi = filtered.filter(s => s.totalScore >= 8).length;
        const kha = filtered.filter(s => s.totalScore >= 6.5 && s.totalScore < 8).length;
        const dat = filtered.filter(s => s.totalScore >= 5 && s.totalScore < 6.5).length;
        const chuaDat = filtered.filter(s => s.totalScore < 5).length;
        return { avg, gioi, kha, dat, chuaDat, count: filtered.length };
      }, [submissions, filterClass]);

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800 font-sans">
          {/* HEADER */}
          <header className="bg-indigo-900 text-white shadow-md no-print sticky top-0 z-50">
            <div className="max-w-6xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="bg-amber-400 text-indigo-950 p-2.5 rounded-xl font-bold flex items-center justify-center shadow">
                  <Icons.BookOpen />
                </div>
                <div>
                  <h1 className="text-base md:text-lg font-black tracking-tight flex items-center gap-2">
                    HỆ THỐNG KIỂM TRA TOÁN THCS (KẾT NỐI TRI THỨC)
                    <span className="text-[10px] bg-amber-400 text-slate-950 px-2 py-0.5 rounded-full font-bold">LỚP 8 & 9</span>
                  </h1>
                  <p className="text-xs text-indigo-200">
                    Chuẩn Ma trận 2025 • Nhận xét chi tiết cả 4 phần • Chấm Tự luận AI Vision • Xuất PDF A4 & Excel
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setView("setup")}
                  className={`px-3.5 py-2 rounded-xl text-xs md:text-sm font-semibold transition ${
                    view === "setup" ? "bg-white text-indigo-950 shadow" : "bg-indigo-800 hover:bg-indigo-700 text-white"
                  }`}
                >
                  Làm bài kiểm tra
                </button>
                <button
                  onClick={() => setView("dashboard")}
                  className={`px-3.5 py-2 rounded-xl text-xs md:text-sm font-semibold flex items-center gap-1.5 transition ${
                    view === "dashboard" ? "bg-white text-indigo-950 shadow" : "bg-indigo-800 hover:bg-indigo-700 text-white"
                  }`}
                >
                  <Icons.BarChart2 /> Thống kê lớp ({submissions.length})
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6">
            {/* ============================================================== */}
            {/* MÀN HÌNH 1: THIẾT LẬP BÀI KIỂM TRA                              */}
            {/* ============================================================== */}
            {view === "setup" && (
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-6">
                <div className="border-b pb-4 flex flex-wrap justify-between items-center gap-4">
                  <div>
                    <h2 className="text-xl font-bold text-slate-900">Thiết lập Bài kiểm tra theo Chương trình SGK</h2>
                    <p className="text-xs md:text-sm text-slate-500 mt-0.5">
                      Toán 6, 7, 8, 9 (Trọng tâm Toán 8 và 9). Mỗi bài học có đúng 3 đề kiểm tra độc lập.
                    </p>
                  </div>
                  
                  {/* Ô NHẬP & TEST GEMINI API KEY */}
                  <div className="flex flex-col items-end gap-1.5">
                    <div className="flex items-center gap-2">
                      <input
                        type="password"
                        placeholder="Dán Gemini API Key vào đây..."
                        value={apiKey}
                        onChange={(e) => saveApiKey(e.target.value)}
                        className="text-xs border border-slate-300 rounded-lg px-3 py-2 w-60 focus:ring-2 focus:ring-indigo-500 outline-none bg-slate-50"
                      />
                      <button
                        onClick={handleTestApiKey}
                        disabled={keyStatus === "testing"}
                        className="bg-indigo-100 hover:bg-indigo-200 text-indigo-900 px-3 py-2 rounded-lg text-xs font-bold transition flex items-center gap-1"
                      >
                        {keyStatus === "testing" ? <Icons.RefreshCw /> : "Kiểm tra Key"}
                      </button>
                    </div>
                    {keyMessage && (
                      <div className={`text-[11px] font-semibold ${
                        keyStatus === "valid" ? "text-emerald-700" :
                        keyStatus === "invalid" ? "text-rose-600" : "text-indigo-600"
                      }`}>
                        {keyMessage}
                      </div>
                    )}
                  </div>
                </div>

                {/* Thông tin học sinh */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-indigo-50/70 p-4 rounded-xl border border-indigo-100">
                  <div>
                    <label className="block text-xs font-bold uppercase text-indigo-900 mb-1">
                      Họ và tên Học sinh *
                    </label>
                    <input
                      type="text"
                      placeholder="VD: Nguyễn Văn An"
                      value={studentName}
                      onChange={(e) => setStudentName(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-600 outline-none bg-white text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-indigo-900 mb-1">
                      Lớp đăng ký (Dùng để thống kê) *
                    </label>
                    <input
                      type="text"
                      placeholder="VD: 9A1, 8B, 7A3..."
                      value={className}
                      onChange={(e) => setClassName(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-600 outline-none bg-white uppercase text-sm font-semibold"
                    />
                  </div>
                </div>

                {/* Lựa chọn khối, chương, bài */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-600 mb-2">
                        1. Khối lớp (Bộ sách Kết nối tri thức)
                      </label>
                      <div className="grid grid-cols-4 gap-2">
                        {["8", "9", "6", "7"].map((g) => (
                          <button
                            key={g}
                            onClick={() => handleGradeChange(g)}
                            className={`py-2.5 rounded-xl font-bold text-sm border transition relative ${
                              selectedGrade === g
                                ? "bg-indigo-600 text-white border-indigo-600 shadow-sm"
                                : "bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100"
                            }`}
                          >
                            Toán {g}
                            {(g === "8" || g === "9") && (
                              <span className="absolute -top-1.5 -right-1 text-[9px] bg-amber-400 text-slate-950 px-1 rounded font-bold">
                                Trọng tâm
                              </span>
                            )}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-600 mb-2">
                        2. Chọn Chương học ({curriculum[selectedGrade]?.chapters.length || 0} chương)
                      </label>
                      <select
                        value={selectedChapter}
                        onChange={(e) => handleChapterChange(e.target.value)}
                        className="w-full p-2.5 rounded-xl border border-slate-300 bg-white text-sm font-medium focus:ring-2 focus:ring-indigo-600 outline-none"
                      >
                        {curriculum[selectedGrade]?.chapters.map((chap) => (
                          <option key={chap.id} value={chap.id}>
                            {chap.title}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-600 mb-2">
                        3. Chọn Bài học cụ thể
                      </label>
                      <select
                        value={selectedLesson}
                        onChange={(e) => setSelectedLesson(e.target.value)}
                        className="w-full p-2.5 rounded-xl border border-slate-300 bg-white text-sm font-medium focus:ring-2 focus:ring-indigo-600 outline-none"
                      >
                        {curriculum[selectedGrade]?.chapters
                          .find((c) => c.id === selectedChapter)
                          ?.lessons.map((les) => (
                            <option key={les} value={les}>
                              {les}
                            </option>
                          ))}
                      </select>
                    </div>
                  </div>

                  <div className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-600 mb-2">
                        4. Chọn Bài kiểm tra (Mỗi bài học gồm đúng 3 đề)
                      </label>
                      <div className="grid grid-cols-3 gap-2.5">
                        {[1, 2, 3].map((num) => (
                          <button
                            key={num}
                            onClick={() => setSelectedTestNum(num)}
                            className={`p-3 rounded-xl border text-center transition flex flex-col items-center justify-center ${
                              selectedTestNum === num
                                ? "bg-amber-400 text-slate-950 border-amber-400 font-bold shadow-sm"
                                : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50"
                            }`}
                          >
                            <span className="text-[10px] uppercase font-bold text-slate-600">Đề chuẩn</span>
                            <span className="text-sm font-black">Bài KT {num}</span>
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Ma trận điểm */}
                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs space-y-1.5">
                      <div className="font-bold text-slate-800 uppercase tracking-wide">
                        Cấu trúc Ma trận Đề kiểm tra (10,0 điểm):
                      </div>
                      <ul className="space-y-1 text-slate-600">
                        <li>• <b>Phần I (3,0đ):</b> 12 câu Trắc nghiệm (0,25đ/câu) - Khóa tuần tự Câu 1 → 12.</li>
                        <li>• <b>Phần II (2,0đ):</b> 2 câu Đúng/Sai (1,0đ/câu) - Chấm lũy tiến 0,1 - 0,25 - 0,5 - 1,0đ.</li>
                        <li>• <b>Phần III (2,0đ):</b> 4 câu Trả lời ngắn (0,5đ/câu) - Điền số nguyên hoặc số thập phân.</li>
                        <li>• <b>Phần IV (3,0đ):</b> 3 câu Tự luận (1,0đ/câu) - Chụp ảnh bài giải, AI Vision chấm chi tiết.</li>
                      </ul>
                    </div>
                  </div>
                </div>

                <div className="pt-2 flex justify-end">
                  <button
                    onClick={generateExamWithAI}
                    disabled={loadingAI}
                    className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-7 py-3 rounded-xl shadow-md flex items-center gap-2 transition disabled:opacity-50"
                  >
                    {loadingAI ? (
                      <>
                        <Icons.RefreshCw /> Đang kết nối AI sinh đề chuẩn ma trận...
                      </>
                    ) : (
                      <>
                        <Icons.Sparkles /> Bắt đầu làm Bài kiểm tra số {selectedTestNum}
                      </>
                    )}
                  </button>
                </div>
              </div>
            )}

            {/* ============================================================== */}
            {/* MÀN HÌNH 2: LÀM BÀI KIỂM TRA                                    */}
            {/* ============================================================== */}
            {view === "exam" && (
              <div className="space-y-6">
                {/* Banner đầu bài */}
                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4">
                  <div>
                    <span className="text-xs font-bold uppercase px-2.5 py-1 bg-indigo-100 text-indigo-800 rounded-md">
                      Khối {selectedGrade} • Lớp {className.toUpperCase()}
                    </span>
                    <h2 className="text-lg font-bold text-slate-900 mt-1">
                      <MathView text={examData.title} />
                    </h2>
                    <p className="text-xs text-slate-500 mt-0.5">Học sinh: <b>{studentName}</b></p>
                  </div>
                  <div className="text-right">
                    <div className="text-xs text-slate-500">Tiến độ Phần I</div>
                    <div className="text-lg font-black text-indigo-600">
                      {Object.keys(mcAnswers).length} / 12 câu
                    </div>
                  </div>
                </div>

                {/* PHẦN I: 12 CÂU TRẮC NGHIỆM TUẦN TỰ */}
                <section className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <div className="border-b pb-3">
                    <h3 className="text-sm md:text-base font-bold text-indigo-950 uppercase">
                      Phần I. Câu trắc nghiệm nhiều lựa chọn (3,0 điểm - 0,25 điểm/câu)
                    </h3>
                    <p className="text-xs text-amber-700 font-medium mt-0.5">
                      * Ràng buộc bắt buộc: Học sinh phải chọn đáp án và xác nhận xong Câu 1 mới được mở Câu 2, tiếp tục tuần tự cho đến Câu 12.
                    </p>
                  </div>

                  <div className="space-y-4">
                    {examData.part1.map((q, index) => {
                      const isUnlocked = index <= mcLockedIndex;
                      return (
                        <div
                          key={q.id}
                          className={`p-4 rounded-xl border transition ${
                            isUnlocked
                              ? "bg-white border-slate-200"
                              : "bg-slate-50/80 border-slate-200 opacity-60 select-none"
                          }`}
                        >
                          <div className="flex items-center justify-between mb-2">
                            <div className="flex items-center gap-2">
                              <span className="px-2.5 py-0.5 bg-indigo-600 text-white text-xs font-bold rounded">
                                Câu {index + 1}
                              </span>
                              <span className="text-xs px-2 py-0.5 bg-slate-100 text-slate-600 rounded font-medium">
                                {q.level}
                              </span>
                            </div>
                            {isUnlocked ? (
                              <span className="text-xs text-emerald-600 flex items-center gap-1 font-semibold">
                                <Icons.Unlock /> Đã mở khóa
                              </span>
                            ) : (
                              <span className="text-xs text-slate-500 flex items-center gap-1 font-medium">
                                <Icons.Lock /> Làm câu {index} để mở
                              </span>
                            )}
                          </div>

                          {isUnlocked ? (
                            <>
                              <div className="text-sm font-medium text-slate-800 mb-3">
                                <MathView text={q.question} />
                              </div>
                              <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                                {q.options.map((opt, optIdx) => {
                                  const labels = ["A", "B", "C", "D"];
                                  const selected = mcAnswers[index] === optIdx;
                                  return (
                                    <button
                                      key={optIdx}
                                      onClick={() => {
                                        setMcAnswers(prev => ({ ...prev, [index]: optIdx }));
                                        if (index === mcLockedIndex && mcLockedIndex < 11) {
                                          setMcLockedIndex(index + 1);
                                        }
                                      }}
                                      className={`text-left px-3.5 py-2.5 rounded-lg border text-sm flex items-center gap-2.5 transition ${
                                        selected
                                          ? "bg-indigo-600 text-white border-indigo-600 font-semibold shadow-sm"
                                          : "bg-slate-50 hover:bg-indigo-50/60 border-slate-200 text-slate-700"
                                      }`}
                                    >
                                      <span
                                        className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 ${
                                          selected ? "bg-white text-indigo-700" : "bg-white border text-slate-600"
                                        }`}
                                      >
                                        {labels[optIdx]}
                                      </span>
                                      <MathView text={opt} />
                                    </button>
                                  );
                                })}
                              </div>
                            </>
                          ) : (
                            <p className="text-xs italic text-slate-400">
                              Câu hỏi số {index + 1} đang bị khóa cho đến khi em chọn đáp án câu {index}.
                            </p>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </section>

                {/* PHẦN II: 2 CÂU ĐÚNG / SAI */}
                <section className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <div className="border-b pb-3">
                    <h3 className="text-sm md:text-base font-bold text-indigo-950 uppercase">
                      Phần II. Câu trắc nghiệm Đúng / Sai (2,0 điểm - 1,0 điểm/câu)
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Thang điểm Bộ GD&ĐT: Đúng 1 ý = 0,1đ • Đúng 2 ý = 0,25đ • Đúng 3 ý = 0,5đ • Đúng cả 4 ý = 1,0đ.
                    </p>
                  </div>

                  <div className="space-y-5">
                    {examData.part2.map((q) => (
                      <div key={q.id} className="p-4 rounded-xl border border-slate-200 bg-slate-50/50 space-y-3">
                        <div className="font-bold text-sm text-slate-900">
                          Câu {q.id}: <MathView text={q.stem} />
                        </div>
                        <div className="space-y-2">
                          {q.statements.map((stmt) => {
                            const currentVal = tfAnswers[q.id]?.[stmt.key];
                            return (
                              <div
                                key={stmt.key}
                                className="bg-white p-3 rounded-lg border border-slate-200 flex flex-wrap items-center justify-between gap-3"
                              >
                                <div className="text-sm text-slate-800 flex-1">
                                  <span className="font-bold text-indigo-700 mr-1.5">{stmt.key})</span>
                                  <MathView text={stmt.text} />
                                  <span className="ml-2 text-[11px] px-2 py-0.5 bg-slate-100 text-slate-500 rounded">
                                    {stmt.level}
                                  </span>
                                </div>
                                <div className="flex items-center gap-2">
                                  <button
                                    onClick={() =>
                                      setTfAnswers(prev => ({
                                        ...prev,
                                        [q.id]: { ...prev[q.id], [stmt.key]: true }
                                      }))
                                    }
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition ${
                                      currentVal === true
                                        ? "bg-emerald-600 text-white border-emerald-600"
                                        : "bg-white text-slate-600 border-slate-300 hover:bg-slate-100"
                                    }`}
                                  >
                                    Đúng
                                  </button>
                                  <button
                                    onClick={() =>
                                      setTfAnswers(prev => ({
                                        ...prev,
                                        [q.id]: { ...prev[q.id], [stmt.key]: false }
                                      }))
                                    }
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition ${
                                      currentVal === false
                                        ? "bg-rose-600 text-white border-rose-600"
                                        : "bg-white text-slate-600 border-slate-300 hover:bg-slate-100"
                                    }`}
                                  >
                                    Sai
                                  </button>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>
                </section>

                {/* PHẦN III: 4 CÂU TRẢ LỜI NGẮN */}
                <section className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <div className="border-b pb-3">
                    <h3 className="text-sm md:text-base font-bold text-indigo-950 uppercase">
                      Phần III. Câu trắc nghiệm Trả lời ngắn (2,0 điểm - 0,5 điểm/câu)
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Gồm 1 câu Thông hiểu, 2 câu Vận dụng thấp và 1 câu Vận dụng cao. Chỉ điền số nguyên hoặc số thập phân.
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {examData.part3.map((q) => (
                      <div key={q.id} className="p-4 rounded-xl border border-slate-200 bg-slate-50/40 flex flex-col justify-between space-y-3">
                        <div>
                          <div className="flex items-center justify-between mb-1.5">
                            <span className="font-bold text-sm text-indigo-900">Câu {q.id}</span>
                            <span className="text-xs px-2 py-0.5 bg-amber-100 text-amber-800 rounded font-medium">
                              {q.level}
                            </span>
                          </div>
                          <div className="text-sm text-slate-800">
                            <MathView text={q.question} />
                          </div>
                        </div>
                        <div>
                          <input
                            type="text"
                            placeholder="Nhập đáp số (VD: 3 hoặc -2.5 hoặc -2,5)..."
                            value={saAnswers[q.id] || ""}
                            onChange={(e) => setSaAnswers(prev => ({ ...prev, [q.id]: e.target.value }))}
                            className="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 bg-white focus:ring-2 focus:ring-indigo-600 outline-none font-semibold"
                          />
                        </div>
                      </div>
                    ))}
                  </div>
                </section>

                {/* PHẦN IV: TỰ LUẬN CHỤP ẢNH / CAMERA */}
                <section className="border border-slate-200 rounded-2xl p-5 space-y-5 bg-white shadow-sm">
                  <div className="border-b pb-3">
                    <span className="text-xs font-bold px-3 py-1 rounded-full bg-purple-100 text-purple-800 uppercase tracking-wide">
                      Phần IV (3,0 điểm)
                    </span>
                    <h3 className="text-sm md:text-base font-bold text-indigo-950 uppercase mt-1">
                      Phần IV. Tự luận - Chụp ảnh bài giải viết tay để AI Vision chấm (3,0 điểm - 1,0 điểm/câu)
                    </h3>
                    <p className="text-xs text-slate-600 mt-1">
                      Học sinh giải bài ra giấy/vở, sau đó có thể chọn một trong hai cách nộp ảnh dưới đây:
                    </p>
                  </div>

                  {/* CÁCH 1: NỘP 1 ẢNH CHUNG TOÀN BỘ PHẦN TỰ LUẬN */}
                  <div className="p-4 rounded-xl border-2 border-dashed border-indigo-300 bg-indigo-50/50 space-y-3">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div>
                        <div className="font-bold text-xs uppercase text-indigo-900 flex items-center gap-1.5">
                          <Icons.Sparkles /> Cách 1: Nộp 1 ảnh chụp chung cho TOÀN BỘ 3 CÂU TỰ LUẬN (Khuyên dùng)
                        </div>
                        <p className="text-[11px] text-slate-600 mt-0.5">
                          Nếu em làm chung 3 câu trên 1 trang giấy, hãy chụp hoặc tải ảnh đó lên tại đây. AI Vision sẽ tự động nhận diện và chấm cả 3 câu.
                        </p>
                      </div>

                      <div className="flex flex-wrap items-center gap-2">
                        <button
                          type="button"
                          onClick={() => openCamera('shared')}
                          className="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs flex items-center gap-1.5 shadow transition"
                        >
                          <Icons.Camera /> Mở Camera chụp ngay
                        </button>
                        <label className="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white hover:bg-indigo-50 text-indigo-700 font-semibold text-xs border border-indigo-300 transition shadow-sm">
                          <Icons.Download />
                          <span>Tải ảnh từ máy / điện thoại</span>
                          <input
                            type="file"
                            accept="image/*"
                            capture="environment"
                            onChange={(e) => handleImageUpload('shared', e)}
                            className="hidden"
                          />
                        </label>
                      </div>
                    </div>

                    {sharedEssayImage && (
                      <div className="flex items-center gap-4 bg-white p-3 rounded-lg border border-indigo-200">
                        <img
                          src={sharedEssayImage}
                          alt="Ảnh chung cả 3 câu tự luận"
                          className="h-16 w-24 object-cover rounded-md border shadow-sm cursor-pointer hover:opacity-90 transition"
                          onClick={() => setZoomImage(sharedEssayImage)}
                          title="Bấm để xem phóng to"
                        />
                        <div className="text-xs space-y-1">
                          <div className="font-bold text-emerald-700 flex items-center gap-1">
                            <Icons.CheckCircle /> Đã tải ảnh bài làm chung cho toàn bộ phần Tự luận
                          </div>
                          <div className="flex items-center gap-3">
                            <button
                              type="button"
                              onClick={() => setZoomImage(sharedEssayImage)}
                              className="text-xs text-indigo-600 hover:underline flex items-center gap-1"
                            >
                              <Icons.Eye /> Xem phóng to
                            </button>
                            <button
                              type="button"
                              onClick={() => setSharedEssayImage(null)}
                              className="text-xs text-rose-600 hover:underline flex items-center gap-1"
                            >
                              <Icons.Trash2 /> Xóa ảnh này
                            </button>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* CÁCH 2: NỘP ẢNH RIÊNG LẺ TỪNG CÂU */}
                  <div className="space-y-3 pt-1">
                    <div className="font-bold text-xs uppercase text-slate-700">
                      Cách 2: Hoặc chụp / tải ảnh bài làm riêng lẻ cho từng câu:
                    </div>

                    {examData.part4.map((q) => {
                      const hasIndividualImg = !!essayImages[q.id];
                      const activeImg = essayImages[q.id] || sharedEssayImage;

                      return (
                        <div key={q.id} className="p-4 rounded-xl border border-slate-200 space-y-3 bg-slate-50/50">
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-sm text-indigo-900">Câu tự luận {q.id} (1,0 điểm)</span>
                            <span className="text-xs px-2.5 py-0.5 bg-purple-100 text-purple-800 rounded font-medium">
                              {q.level}
                            </span>
                          </div>
                          <div className="text-sm font-medium text-slate-800 bg-white p-3 rounded-lg border border-slate-100">
                            <MathView text={q.question} />
                          </div>

                          <div className="flex flex-wrap items-center justify-between gap-3 pt-1">
                            <div className="flex flex-wrap items-center gap-2">
                              <button
                                type="button"
                                onClick={() => openCamera(q.id)}
                                className="px-3 py-1.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold text-xs border border-indigo-200 flex items-center gap-1.5 transition"
                              >
                                <Icons.Camera /> Camera Câu {q.id}
                              </button>
                              <label className="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white hover:bg-slate-100 text-slate-700 font-semibold text-xs border border-slate-300 transition">
                                <Icons.Download />
                                <span>Tải ảnh Câu {q.id}</span>
                                <input
                                  type="file"
                                  accept="image/*"
                                  capture="environment"
                                  onChange={(e) => handleImageUpload(q.id, e)}
                                  className="hidden"
                                />
                              </label>
                            </div>

                            {activeImg && (
                              <div className="flex items-center gap-2.5 bg-white px-2.5 py-1.5 rounded-lg border border-slate-200">
                                <img
                                  src={activeImg}
                                  alt={`Bài làm câu ${q.id}`}
                                  className="h-10 w-16 object-cover rounded border shadow-sm cursor-pointer hover:opacity-90 transition"
                                  onClick={() => setZoomImage(activeImg)}
                                  title="Bấm để xem phóng to"
                                />
                                <span className="text-[11px] font-medium text-slate-600">
                                  {hasIndividualImg ? "Ảnh riêng câu " + q.id : "Đang dùng ảnh chung"}
                                </span>
                                {hasIndividualImg && (
                                  <button
                                    type="button"
                                    onClick={() => setEssayImages(prev => ({ ...prev, [q.id]: null }))}
                                    className="text-[11px] text-rose-600 hover:underline ml-1"
                                  >
                                    Xóa
                                  </button>
                                )}
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </section>

                {/* NÚT NỘP BÀI */}
                <div className="flex justify-end gap-3 pb-8">
                  <button
                    onClick={handleSubmitExam}
                    disabled={loadingAI}
                    className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3.5 rounded-xl shadow-lg flex items-center gap-2 transition disabled:opacity-50"
                  >
                    {loadingAI ? (
                      <>
                        <Icons.RefreshCw /> AI đang chấm điểm & viết nhận xét cả 4 phần...
                      </>
                    ) : (
                      <>
                        <Icons.CheckCircle /> Nộp bài & Chấm điểm tự động
                      </>
                    )}
                  </button>
                </div>
              </div>
            )}

            {/* ============================================================== */}
            {/* MÀN HÌNH 3: PHIẾU KẾT QUẢ VÀ XUẤT PDF A4                        */}
            {/* ============================================================== */}
            {view === "result" && resultData && (
              <div className="space-y-6">
                <div className="flex justify-between items-center no-print">
                  <button
                    onClick={() => setView("setup")}
                    className="text-sm font-semibold text-indigo-700 hover:underline"
                  >
                    ← Quay lại làm đề khác
                  </button>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={handleExportPDF}
                      className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-xl shadow flex items-center gap-2 text-sm"
                    >
                      <Icons.Download /> Xuất file PDF (Chuẩn A4)
                    </button>
                    <button
                      onClick={() => window.print()}
                      className="bg-slate-700 hover:bg-slate-800 text-white font-bold px-4 py-2.5 rounded-xl text-sm"
                    >
                      In trực tiếp
                    </button>
                  </div>
                </div>

                {/* KHU VỰC IN PHIẾU KẾT QUẢ A4 */}
                <div id="report-card-pdf" className="bg-white p-8 rounded-2xl shadow-sm border border-slate-300 space-y-6 print-shadow-none">
                  <div className="border-b-2 border-slate-800 pb-4 flex justify-between items-start">
                    <div>
                      <h2 className="text-xl font-black uppercase text-slate-900">
                        PHIẾU KẾT QUẢ BÀI KIỂM TRA MÔN TOÁN
                      </h2>
                      <p className="text-sm font-semibold text-indigo-800 mt-1">
                        Bộ sách: Kết nối tri thức với cuộc sống - Khối {resultData.grade}
                      </p>
                      <p className="text-xs text-slate-600 mt-0.5">
                        Bài học: <b>{resultData.lesson}</b> | Đề: <b>Bài kiểm tra số {resultData.testNum}</b>
                      </p>
                    </div>
                    <div className="text-right">
                      <div className="inline-block bg-indigo-900 text-white px-4 py-2 rounded-xl text-center">
                        <div className="text-[10px] uppercase tracking-wider opacity-80">Tổng điểm</div>
                        <div className="text-3xl font-black text-amber-400">{resultData.totalScore} / 10</div>
                      </div>
                    </div>
                  </div>

                  {/* Thông tin học sinh */}
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm">
                    <div>
                      <span className="text-slate-500 text-xs block">Họ và tên học sinh:</span>
                      <strong className="text-slate-900">{resultData.studentName}</strong>
                    </div>
                    <div>
                      <span className="text-slate-500 text-xs block">Lớp đăng ký:</span>
                      <strong className="text-indigo-700">{resultData.className}</strong>
                    </div>
                    <div>
                      <span className="text-slate-500 text-xs block">Thời gian nộp bài:</span>
                      <strong className="text-slate-800">{resultData.timestamp}</strong>
                    </div>
                    <div>
                      <span className="text-slate-500 text-xs block">Xếp loại năng lực:</span>
                      <strong className="text-emerald-700">
                        {resultData.totalScore >= 8 ? "Giỏi" : resultData.totalScore >= 6.5 ? "Khá" : resultData.totalScore >= 5 ? "Đạt" : "Chưa đạt"}
                      </strong>
                    </div>
                  </div>

                  {/* Bảng điểm 4 phần */}
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
                    <div className="p-3 rounded-xl border bg-white">
                      <div className="text-xs text-slate-500">Phần I (12 câu TN)</div>
                      <div className="text-lg font-bold text-slate-900">{resultData.scorePart1} / 3,0đ</div>
                    </div>
                    <div className="p-3 rounded-xl border bg-white">
                      <div className="text-xs text-slate-500">Phần II (2 câu Đúng/Sai)</div>
                      <div className="text-lg font-bold text-slate-900">{resultData.scorePart2} / 2,0đ</div>
                    </div>
                    <div className="p-3 rounded-xl border bg-white">
                      <div className="text-xs text-slate-500">Phần III (4 câu TL ngắn)</div>
                      <div className="text-lg font-bold text-slate-900">{resultData.scorePart3} / 2,0đ</div>
                    </div>
                    <div className="p-3 rounded-xl border bg-white">
                      <div className="text-xs text-slate-500">Phần IV (3 câu Tự luận)</div>
                      <div className="text-lg font-bold text-slate-900">{resultData.scorePart4} / 3,0đ</div>
                    </div>
                  </div>

                  {/* KHU VỰC NHẬN XÉT CHI TIẾT CẢ 4 PHẦN VÀ ĐÁNH GIÁ CHUNG */}
                  <div className="space-y-3">
                    <div className="flex items-center gap-2 border-b-2 border-indigo-900 pb-1.5">
                      <Icons.Award />
                      <h3 className="font-black text-sm md:text-base uppercase text-indigo-950 tracking-tight">
                        Phiếu nhận xét đánh giá chi tiết cả 4 phần kiểm tra:
                      </h3>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                      {/* Nhận xét Phần I */}
                      <div className="bg-blue-50/70 border border-blue-200 rounded-xl p-3.5 space-y-1">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold uppercase text-blue-900 flex items-center gap-1.5">
                            <span className="w-2 h-2 rounded-full bg-blue-600"></span>
                            Phần I. Trắc nghiệm 4 lựa chọn
                          </span>
                          <span className="text-xs font-black text-blue-700 bg-white px-2 py-0.5 rounded border border-blue-200">
                            {resultData.scorePart1} / 3,0đ
                          </span>
                        </div>
                        <p className="text-xs text-slate-700 leading-relaxed font-medium">
                          {resultData.feedbacks?.part1}
                        </p>
                      </div>

                      {/* Nhận xét Phần II */}
                      <div className="bg-emerald-50/70 border border-emerald-200 rounded-xl p-3.5 space-y-1">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold uppercase text-emerald-900 flex items-center gap-1.5">
                            <span className="w-2 h-2 rounded-full bg-emerald-600"></span>
                            Phần II. Trắc nghiệm Đúng / Sai
                          </span>
                          <span className="text-xs font-black text-emerald-700 bg-white px-2 py-0.5 rounded border border-emerald-200">
                            {resultData.scorePart2} / 2,0đ
                          </span>
                        </div>
                        <p className="text-xs text-slate-700 leading-relaxed font-medium">
                          {resultData.feedbacks?.part2}
                        </p>
                      </div>

                      {/* Nhận xét Phần III */}
                      <div className="bg-amber-50/70 border border-amber-200 rounded-xl p-3.5 space-y-1">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold uppercase text-amber-900 flex items-center gap-1.5">
                            <span className="w-2 h-2 rounded-full bg-amber-600"></span>
                            Phần III. Trắc nghiệm Trả lời ngắn
                          </span>
                          <span className="text-xs font-black text-amber-700 bg-white px-2 py-0.5 rounded border border-amber-200">
                            {resultData.scorePart3} / 2,0đ
                          </span>
                        </div>
                        <p className="text-xs text-slate-700 leading-relaxed font-medium">
                          {resultData.feedbacks?.part3}
                        </p>
                      </div>

                      {/* Nhận xét Phần IV */}
                      <div className="bg-purple-50/70 border border-purple-200 rounded-xl p-3.5 space-y-1">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold uppercase text-purple-900 flex items-center gap-1.5">
                            <span className="w-2 h-2 rounded-full bg-purple-600"></span>
                            Phần IV. Tự luận viết tay (AI Vision)
                          </span>
                          <span className="text-xs font-black text-purple-700 bg-white px-2 py-0.5 rounded border border-purple-200">
                            {resultData.scorePart4} / 3,0đ
                          </span>
                        </div>
                        <p className="text-xs text-slate-700 leading-relaxed font-medium">
                          {resultData.feedbacks?.part4}
                        </p>
                      </div>
                    </div>

                    {/* Đánh giá & Định hướng tổng quát */}
                    <div className="bg-indigo-50 border-2 border-indigo-200 rounded-xl p-4 space-y-1.5">
                      <div className="text-xs font-bold uppercase text-indigo-900 flex items-center gap-1.5">
                        <Icons.Sparkles />
                        Đánh giá tổng quát năng lực & Định hướng học tập:
                      </div>
                      <p className="text-sm text-slate-800 leading-relaxed font-medium">
                        {resultData.feedbacks?.overall || resultData.overallTeacherComment}
                      </p>
                    </div>
                  </div>

                  {/* Chi tiết tự luận chấm AI Vision Chuẩn Bộ GD&ĐT */}
                  <div className="space-y-4 pt-2">
                    <div className="flex flex-wrap items-center justify-between gap-2 border-b pb-2">
                      <h4 className="font-bold text-sm uppercase text-slate-900 flex items-center gap-2">
                        <Icons.Sparkles /> Bảng Chi tiết Chấm Tự luận & OCR Chữ Viết Tay (Phần IV - 3,0 điểm):
                      </h4>
                      <span className="text-xs text-indigo-700 font-bold bg-indigo-50 px-2.5 py-1 rounded-lg">
                        Tổng điểm Tự luận: {resultData.scorePart4} / 3,0 điểm
                      </span>
                    </div>

                    {examData.part4.map((q) => {
                      const fb = resultData.essayFeedbacks?.[q.id] || {};
                      const usedImg = fb.usedImage || (resultData.essayImages && resultData.essayImages[q.id]) || resultData.sharedEssayImage;

                      return (
                        <div key={q.id} className="p-4 rounded-xl border border-indigo-100 bg-white shadow-sm space-y-3">
                          {/* Header câu hỏi */}
                          <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-2">
                            <div className="font-bold text-sm text-slate-900">
                              Câu {q.id} ({q.level}): <MathView text={q.question} />
                            </div>
                            <span className={`px-2.5 py-1 rounded-lg text-xs font-bold ${
                              fb.score === 1.0 ? 'bg-emerald-100 text-emerald-800' :
                              fb.score >= 0.75 ? 'bg-blue-100 text-blue-800' :
                              fb.score >= 0.5 ? 'bg-amber-100 text-amber-800' :
                              'bg-rose-100 text-rose-800'
                            }`}>
                              Điểm: {Number((fb.score || 0).toFixed(2))} / 1,0 điểm
                            </span>
                          </div>

                          {/* Ảnh bài làm học sinh đã nộp */}
                          {usedImg && (
                            <div className="flex items-center gap-3 bg-slate-50 p-2.5 rounded-lg border border-slate-200 no-print">
                              <img
                                src={usedImg}
                                alt={`Ảnh bài làm câu ${q.id}`}
                                className="w-24 h-16 object-cover rounded border shadow-sm cursor-pointer hover:opacity-90 transition"
                                onClick={() => setZoomImage(usedImg)}
                                title="Bấm để xem phóng to ảnh bài làm"
                              />
                              <div className="text-xs text-slate-600">
                                <span className="font-semibold text-slate-800">Ảnh bài giải viết tay của học sinh</span>
                                <div className="text-[11px] text-indigo-600 hover:underline cursor-pointer flex items-center gap-1 mt-0.5" onClick={() => setZoomImage(usedImg)}>
                                  <Icons.Maximize2 /> Bấm vào ảnh để phóng to kiểm tra nét chữ
                                </div>
                              </div>
                            </div>
                          )}

                          {/* OCR: Trích xuất chữ viết tay */}
                          <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs">
                            <div className="font-bold text-slate-700 mb-1 flex items-center gap-1.5">
                              <span>📝 Trích xuất bài giải viết tay (OCR):</span>
                            </div>
                            <div className="text-slate-800 leading-relaxed font-mono">
                              <MathView text={fb.ocrText || "(Không nhận diện được bài viết)"} />
                            </div>
                          </div>

                          {/* Bảng Barem chấm chi tiết từng bước */}
                          {fb.steps && fb.steps.length > 0 && (
                            <div className="overflow-x-auto">
                              <table className="w-full text-xs text-left border-collapse border border-slate-200">
                                <thead className="bg-indigo-50/70 text-indigo-900 font-bold">
                                  <tr>
                                    <th className="p-2 border border-slate-200">Các bước chấm theo barem Bộ GD&ĐT</th>
                                    <th className="p-2 border border-slate-200 text-center w-20">Tối đa</th>
                                    <th className="p-2 border border-slate-200 text-center w-20">Điểm đạt</th>
                                    <th className="p-2 border border-slate-200 text-center w-24">Trạng thái</th>
                                    <th className="p-2 border border-slate-200">Chi tiết nhận xét</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  {fb.steps.map((st, sIdx) => (
                                    <tr key={sIdx} className="border-b border-slate-100 hover:bg-slate-50/60">
                                      <td className="p-2 border border-slate-200 font-medium text-slate-800">{st.step}</td>
                                      <td className="p-2 border border-slate-200 text-center text-slate-500">{st.maxScore || st.max}đ</td>
                                      <td className="p-2 border border-slate-200 text-center font-bold text-indigo-700">{st.awardedScore ?? st.awarded ?? st.score}đ</td>
                                      <td className="p-2 border border-slate-200 text-center">
                                        <span className={`px-2 py-0.5 rounded text-[11px] font-bold ${
                                          (st.status || "").toLowerCase().includes("đúng") ? "bg-emerald-100 text-emerald-800" :
                                          (st.status || "").toLowerCase().includes("sai") ? "bg-rose-100 text-rose-800" : "bg-amber-100 text-amber-800"
                                        }`}>
                                          {st.status || "Đạt"}
                                        </span>
                                      </td>
                                      <td className="p-2 border border-slate-200 text-slate-700">{st.note || st.feedback}</td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                          )}

                          {/* Lỗi sai cụ thể nếu có */}
                          {fb.mistakes && (
                            <div className="bg-rose-50 border border-rose-200 p-2.5 rounded-lg text-xs text-rose-900 flex items-start gap-2">
                              <Icons.AlertTriangle />
                              <div>
                                <span className="font-bold">Lưu ý lỗi sai:</span> {fb.mistakes}
                              </div>
                            </div>
                          )}

                          {/* Lời phê sư phạm */}
                          <div className="bg-emerald-50 border border-emerald-200 p-2.5 rounded-lg text-xs text-emerald-900">
                            <span className="font-bold">👨‍🏫 Lời phê của giáo viên AI:</span> {fb.comment}
                          </div>

                          {/* Lời giải mẫu chuẩn tham khảo */}
                          {fb.modelSolution && (
                            <div className="bg-indigo-50/50 border border-indigo-200 p-3 rounded-lg text-xs">
                              <div className="font-bold text-indigo-900 mb-1">📖 Lời giải mẫu chuẩn tham khảo:</div>
                              <div className="text-slate-800 leading-relaxed">
                                <MathView text={fb.modelSolution} />
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* ============================================================== */}
            {/* MÀN HÌNH 4: THỐNG KÊ LỚP HỌC & XUẤT EXCEL / CSV                  */}
            {/* ============================================================== */}
            {view === "dashboard" && (
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">
                <div className="flex flex-wrap justify-between items-center gap-4 border-b pb-4">
                  <div>
                    <h2 className="text-xl font-bold text-slate-900">
                      Bảng Thống kê Kết quả Học tập theo Lớp
                    </h2>
                    <p className="text-xs md:text-sm text-slate-500 mt-0.5">
                      Bộ lọc lớp, điểm trung bình, phân loại năng lực và xuất file Excel / CSV đầy đủ nhận xét 4 phần
                    </p>
                  </div>

                  <div className="flex flex-wrap items-center gap-2 no-print">
                    <button
                      onClick={handleExportExcel}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow"
                    >
                      <Icons.FileSpreadsheet /> Xuất Excel (.xlsx)
                    </button>
                    <button
                      onClick={handleExportCSV}
                      className="bg-teal-600 hover:bg-teal-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow"
                    >
                      <Icons.Download /> Xuất CSV
                    </button>
                    {submissions.length > 0 && (
                      <button
                        onClick={() => {
                          if (window.confirm("Thầy/Cô có chắc chắn muốn xóa toàn bộ lịch sử điểm số đã lưu?")) {
                            setSubmissions([]);
                            localStorage.removeItem("MATH_SUBMISSIONS_KNTT");
                          }
                        }}
                        className="bg-rose-50 text-rose-600 hover:bg-rose-100 px-3 py-2 rounded-xl text-xs font-bold border border-rose-200 transition flex items-center gap-1"
                      >
                        Xóa lịch sử
                      </button>
                    )}
                  </div>
                </div>

                {/* Thống kê nhanh */}
                {classStats && (
                  <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                    <div className="bg-indigo-50 border border-indigo-200 p-3.5 rounded-xl text-center">
                      <div className="text-xs text-indigo-700 font-bold uppercase">Điểm TB Lớp</div>
                      <div className="text-2xl font-black text-indigo-950 mt-1">{classStats.avg}</div>
                    </div>
                    <div className="bg-emerald-50 border border-emerald-200 p-3.5 rounded-xl text-center">
                      <div className="text-xs text-emerald-700 font-bold uppercase">Giỏi (≥ 8.0)</div>
                      <div className="text-2xl font-black text-emerald-800 mt-1">{classStats.gioi} <span className="text-xs font-normal">({Math.round((classStats.gioi / classStats.count) * 100)}%)</span></div>
                    </div>
                    <div className="bg-blue-50 border border-blue-200 p-3.5 rounded-xl text-center">
                      <div className="text-xs text-blue-700 font-bold uppercase">Khá (6.5 - 7.9)</div>
                      <div className="text-2xl font-black text-blue-800 mt-1">{classStats.kha} <span className="text-xs font-normal">({Math.round((classStats.kha / classStats.count) * 100)}%)</span></div>
                    </div>
                    <div className="bg-amber-50 border border-amber-200 p-3.5 rounded-xl text-center">
                      <div className="text-xs text-amber-700 font-bold uppercase">Đạt (5.0 - 6.4)</div>
                      <div className="text-2xl font-black text-amber-800 mt-1">{classStats.dat} <span className="text-xs font-normal">({Math.round((classStats.dat / classStats.count) * 100)}%)</span></div>
                    </div>
                    <div className="bg-rose-50 border border-rose-200 p-3.5 rounded-xl text-center">
                      <div className="text-xs text-rose-700 font-bold uppercase">Chưa đạt (&lt; 5.0)</div>
                      <div className="text-2xl font-black text-rose-800 mt-1">{classStats.chuaDat} <span className="text-xs font-normal">({Math.round((classStats.chuaDat / classStats.count) * 100)}%)</span></div>
                    </div>
                  </div>
                )}

                {/* Bộ lọc theo lớp */}
                <div className="flex flex-wrap items-center gap-3 bg-slate-50 p-3.5 rounded-xl border border-slate-200 text-xs">
                  <span className="font-bold text-slate-700">Lọc theo Lớp học:</span>
                  <button
                    onClick={() => setFilterClass("ALL")}
                    className={`px-3 py-1.5 rounded-lg font-semibold transition ${
                      filterClass === "ALL"
                        ? "bg-indigo-600 text-white"
                        : "bg-white text-slate-700 border border-slate-300 hover:bg-slate-100"
                    }`}
                  >
                    Tất cả ({submissions.length})
                  </button>
                  {uniqueClasses.map((cls) => {
                    const count = submissions.filter(s => s.className === cls).length;
                    return (
                      <button
                        key={cls}
                        onClick={() => setFilterClass(cls)}
                        className={`px-3 py-1.5 rounded-lg font-semibold transition ${
                          filterClass === cls
                            ? "bg-indigo-600 text-white"
                            : "bg-white text-slate-700 border border-slate-300 hover:bg-slate-100"
                        }`}
                      >
                        Lớp {cls} ({count})
                      </button>
                    );
                  })}
                </div>

                {getFilteredSubmissions().length === 0 ? (
                  <div className="text-center py-12 text-slate-400 text-sm">
                    Chưa có dữ liệu bài làm nào được ghi nhận cho lớp này.
                  </div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse text-xs md:text-sm">
                      <thead>
                        <tr className="bg-slate-100 text-slate-700 text-[11px] uppercase font-bold">
                          <th className="p-3 border">Lớp</th>
                          <th className="p-3 border">Họ tên Học sinh</th>
                          <th className="p-3 border text-center">Khối</th>
                          <th className="p-3 border">Bài học & Đề</th>
                          <th className="p-3 border text-center">P.I (3đ)</th>
                          <th className="p-3 border text-center">P.II (2đ)</th>
                          <th className="p-3 border text-center">P.III (2đ)</th>
                          <th className="p-3 border text-center">P.IV (3đ)</th>
                          <th className="p-3 border text-center">Tổng</th>
                          <th className="p-3 border text-center">Xếp loại</th>
                          <th className="p-3 border">Đánh giá chung</th>
                        </tr>
                      </thead>
                      <tbody>
                        {getFilteredSubmissions().map((sub) => (
                          <tr key={sub.id} className="hover:bg-slate-50 transition">
                            <td className="p-3 border font-bold text-indigo-700">{sub.className}</td>
                            <td className="p-3 border font-medium text-slate-900">{sub.studentName}</td>
                            <td className="p-3 border text-center">Toán {sub.grade}</td>
                            <td className="p-3 border text-xs">
                              <div className="font-medium text-slate-800">{sub.lesson}</div>
                              <span className="text-indigo-600 font-semibold">Bài KT số {sub.testNum}</span>
                            </td>
                            <td className="p-3 border text-center">{sub.scorePart1}</td>
                            <td className="p-3 border text-center">{sub.scorePart2}</td>
                            <td className="p-3 border text-center">{sub.scorePart3}</td>
                            <td className="p-3 border text-center">{sub.scorePart4}</td>
                            <td className="p-3 border text-center font-bold text-emerald-700 text-sm">{sub.totalScore}</td>
                            <td className="p-3 border text-center">
                              <span className={`px-2 py-0.5 rounded font-bold text-[11px] ${
                                sub.totalScore >= 8 ? "bg-emerald-100 text-emerald-800" :
                                sub.totalScore >= 6.5 ? "bg-blue-100 text-blue-800" :
                                sub.totalScore >= 5 ? "bg-amber-100 text-amber-800" : "bg-rose-100 text-rose-800"
                              }`}>
                                {sub.totalScore >= 8 ? "Giỏi" : sub.totalScore >= 6.5 ? "Khá" : sub.totalScore >= 5 ? "Đạt" : "Chưa đạt"}
                              </span>
                            </td>
                            <td className="p-3 border text-xs text-slate-600 max-w-xs">{sub.feedbacks?.overall || sub.overallTeacherComment}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}
          
          {/* MODAL PHÓNG TO ẢNH BÀI LÀM VIẾT TAY */}
          {zoomImage && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4" onClick={() => setZoomImage(null)}>
              <div className="relative max-w-4xl max-h-[90vh] bg-white rounded-2xl p-3 shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center p-2 border-b">
                  <span className="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                    <Icons.Camera /> Xem ảnh bài làm viết tay học sinh
                  </span>
                  <button onClick={() => setZoomImage(null)} className="p-1 rounded-lg hover:bg-slate-100 text-slate-500 font-bold text-sm">
                    ✕ Đóng
                  </button>
                </div>
                <div className="overflow-auto max-h-[80vh] flex items-center justify-center p-2 bg-slate-900/5">
                  <img src={zoomImage} alt="Bài làm viết tay phóng to" className="max-w-full max-h-full object-contain rounded-lg shadow-sm" />
                </div>
              </div>
            </div>
          )}

          {/* MODAL MỞ CAMERA CHỤP TRỰC TIẾP */}
          {cameraActiveModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="relative w-full max-w-xl bg-white rounded-2xl p-5 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-base text-slate-900 flex items-center gap-2">
                    <Icons.Camera /> Chụp ảnh bài làm viết tay {cameraActiveModal === 'shared' ? '(Cả 3 câu Tự luận)' : `(Câu ${cameraActiveModal})`}
                  </h3>
                  <button onClick={stopCamera} className="text-slate-400 hover:text-slate-700 font-bold text-lg">✕</button>
                </div>
                <div className="relative bg-black rounded-xl overflow-hidden aspect-[4/3] flex items-center justify-center">
                  <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover"></video>
                </div>
                <div className="flex justify-between items-center pt-2">
                  <button onClick={stopCamera} className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">
                    Hủy bỏ
                  </button>
                  <button onClick={captureCameraFrame} className="px-6 py-2.5 rounded-xl text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 shadow flex items-center gap-2 transition">
                    <Icons.Camera /> Chụp & Dùng ảnh này
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* OVERLAY TIẾN ĐỘ CHẤM BÀI AI VISION */}
          {loadingAI && gradingProgress && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 shadow-2xl max-w-md w-full text-center space-y-4">
                <div className="w-14 h-14 mx-auto rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center animate-spin">
                  <Icons.RefreshCw />
                </div>
                <div>
                  <h4 className="font-bold text-slate-900 text-base">Hệ thống đang chấm bài thi</h4>
                  <p className="text-xs text-indigo-700 font-semibold mt-1.5 animate-pulse">
                    {gradingProgress}
                  </p>
                </div>
                <div className="text-[11px] text-slate-500 bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                  AI Vision đang phân tích ảnh chụp, đọc từng dòng chữ viết tay, đối chiếu barem điểm chuẩn của Bộ GD&ĐT. Vui lòng chờ trong giây lát...
                </div>
              </div>
            </div>
          )}

        </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
